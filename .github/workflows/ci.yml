name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: End-to-end harness (every pipeline, incl. stdio MCP and the check CLI)
        run: npm run e2e
      - name: Accessibility audit (axe-core over the site and every demo view)
        run: npm run a11y
      - name: Design lint (Hallmark, app scope)
        run: npm run lint:design
      - name: Design lint (Hallmark, page scope, site)
        run: npm run lint:site
      - name: Progress index is current
        run: npm run progress:check
