name: Forge deploy (manual)

# Manual only. Refuses to run until the app is registered (app.id in
# app/manifest.yml is still the placeholder written by the repo).
# Requires repository secrets: FORGE_EMAIL and FORGE_API_TOKEN (Atlassian API token).
# UNVERIFIED until the Forge app is registered and this runs once.
#
# Forge does not build the Custom UI or the workspace packages: this workflow
# builds the engine (the backend bundles @traceflow/core from its dist) and the
# Custom UI (the manifest's resource is the built directory), checks the
# manifest with Atlassian's validator, then deploys.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Forge environment to deploy to
        type: choice
        default: development
        options:
          - development
          - staging
          - production

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the Forge app is registered
        id: check
        run: |
          if grep -q "REPLACE_AFTER_FORGE_REGISTER" app/manifest.yml; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::app/manifest.yml still has the placeholder app id. Run 'forge register' in app/ and commit the id first (see app/README.md)."
          else
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install, build the engine and the Custom UI, check the manifest
        if: steps.check.outputs.exists == 'true'
        run: |
          npm ci
          npm run forge:build
          npm run forge:check

      - name: Install the Forge CLI
        if: steps.check.outputs.exists == 'true'
        run: npm install -g @forge/cli@15

      - name: Deploy
        if: steps.check.outputs.exists == 'true'
        working-directory: app
        env:
          FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
          FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
          FORGE_ENV: ${{ inputs.environment }}
        run: |
          forge settings set usage-analytics false
          forge deploy --non-interactive -e "$FORGE_ENV"
