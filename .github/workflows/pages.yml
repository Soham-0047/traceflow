name: Pages (site + demo)

# Publishes the landing page (site/) and the sample-data demo (demo/) to GitHub
# Pages as one site: the page at / and the demo under /demo/.
# $0: no external accounts and no secrets; the workflow uses the automatically
# provided GITHUB_TOKEN.
#
# Self-setup: the deploy job first makes sure the Pages site builds from
# "GitHub Actions" (Settings -> Pages -> Build and deployment -> Source).
# That single setting is the one thing the REST API kept rejecting for a
# fine-grained PAT ("Resource not accessible"), and without it
# actions/deploy-pages fails with HttpError: Not Found. The GITHUB_TOKEN of
# this workflow carries `pages: write`, so the first run flips the setting
# itself; later runs see it already set and move on.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @traceflow/demo
      - name: Assemble the Pages artifact (site at /, demo at /demo/)
        run: |
          mkdir -p pages-out/demo
          cp -r site/. pages-out/
          cp -r demo/dist/. pages-out/demo/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Ensure Pages builds from GitHub Actions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          current="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/pages" | jq -r '.build_type // ""')"
          if [ "$current" = "workflow" ]; then
            echo "Pages already builds from GitHub Actions; nothing to do."
            exit 0
          fi
          echo "Pages build_type is '${current:-unset}'; switching it to workflow (GitHub Actions)..."
          code="$(curl -sS -o /tmp/pages-put.json -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/pages" -d '{"build_type":"workflow"}')"
          if [ "$code" != "200" ] && [ "$code" != "204" ]; then
            echo "PUT /repos/$REPO/pages failed with HTTP $code:"
            cat /tmp/pages-put.json || true
            echo
            echo "::error::Could not set the Pages source to GitHub Actions. Flip it once manually (Settings -> Pages -> Build and deployment -> Source: GitHub Actions), then re-run this job."
            exit 1
          fi
          echo "Pages source is now GitHub Actions."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
