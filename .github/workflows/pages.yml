name: Pages (site + demo)

# Publishes the landing page (site/) and the sample-data demo (demo/) to GitHub
# Pages as one site: the page at / and the demo under /demo/.
# $0: no external accounts; the workflow uses the automatically provided
# GITHUB_TOKEN.
#
# Pages must build from "GitHub Actions" (Settings -> Pages -> Build and
# deployment -> Source). GitHub blocks both the GITHUB_TOKEN and read-only
# PATs from changing that setting, so it cannot be automated from here:
# either flip it once in the UI, or store a fine-grained PAT with
# "Pages: Read and write" as the PAGES_TOKEN secret and every run self-heals.
# The deploy job checks the setting first and fails with these exact steps
# instead of deploy-pages' cryptic "HttpError: Not Found".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @traceflow/demo
      - name: Assemble the Pages artifact (site at /, demo at /demo/)
        run: |
          mkdir -p pages-out/demo
          cp -r site/. pages-out/
          cp -r demo/dist/. pages-out/demo/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Ensure Pages builds from GitHub Actions
        env:
          # GITHUB_TOKEN may read but not change Pages settings; a fine-grained
          # PAT with "Pages: Read and write" stored as PAGES_TOKEN can.
          GH_TOKEN: ${{ secrets.PAGES_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          current="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/pages" | jq -r '.build_type // ""')"
          if [ "$current" = "workflow" ]; then
            echo "Pages already builds from GitHub Actions; nothing to do."
            exit 0
          fi
          echo "Pages build_type is '${current:-unset}'; trying to switch it to workflow (GitHub Actions)..."
          code="$(curl -sS -o /tmp/pages-put.json -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/pages" -d '{"build_type":"workflow"}')"
          if [ "$code" = "200" ] || [ "$code" = "204" ]; then
            echo "Pages source is now GitHub Actions."
            exit 0
          fi
          echo "PUT /repos/$REPO/pages failed with HTTP $code:"
          cat /tmp/pages-put.json || true
          echo
          echo "::error::The Pages site still builds from the legacy branch source, and only a Pages-write token or the repo UI can change that. Pick one 10-second fix:"
          echo "::error::1. Repo Settings -> Pages -> Build and deployment -> Source: 'GitHub Actions', then re-run this job (Actions tab -> Pages (site + demo) -> re-run failed jobs)."
          echo "::error::2. Or add a fine-grained PAT with 'Pages: Read and write' as the PAGES_TOKEN secret, and every run self-heals."
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
