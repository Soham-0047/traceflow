# TraceFlow Forge app (TF-01, TF-04, TF-06). UNVERIFIED: not deployed yet.
#
# GENERATED by scripts/forge-manifest.mjs from the shared tool catalog
# (packages/core/src/tools.ts). Edit the script or the catalog, then run
# `npm run forge:manifest`; `npm run forge:check` (in verify and CI) validates
# this file with Atlassian's own manifest validator and fails when it is stale.
#
# One-time setup (see app/README.md):
#   1. forge login
#   2. forge register  -> writes the real app id into app.id below (kept by the script)
#   3. npm run forge:build && cd app && forge deploy --non-interactive -e development
app:
  id: ari:cloud:ecosystem::app/REPLACE_AFTER_FORGE_REGISTER
  runtime:
    name: nodejs24.x
modules:
  jira:globalPage:
    - key: traceflow-workbench
      resource: workbench-ui
      resolver:
        function: tf-resolver
      title: TraceFlow
  function:
    - key: tf-resolver
      handler: backend/index.handler
    - key: tf-list-people
      handler: backend/tools.listPeople
    - key: tf-person-risk
      handler: backend/tools.personRisk
    - key: tf-person-impact
      handler: backend/tools.personImpact
    - key: tf-epic-lineage
      handler: backend/tools.epicLineage
    - key: tf-decision-trace
      handler: backend/tools.decisionTrace
    - key: tf-epic-impact
      handler: backend/tools.epicImpact
    - key: tf-decision-impact
      handler: backend/tools.decisionImpact
    - key: tf-overview
      handler: backend/tools.overview
    - key: tf-investigate
      handler: backend/tools.investigate
  # Every TraceFlow tool is a read-only Rovo action (actionVerb GET) backed by
  # the shared catalog; the handlers live in app/src/backend/tools.ts.
  action:
    - key: traceflow-list-people
      name: "List people by knowledge risk"
      function: tf-list-people
      actionVerb: GET
      description: "Lists everyone in the connected Jira and Confluence records with their knowledge-risk score, level and finding count, highest risk first. Read-only."
    - key: traceflow-person-risk
      name: "Investigate a person"
      function: tf-person-risk
      actionVerb: GET
      description: "Full knowledge-risk report for one person: findings with their evidence records, points, suggested hand-off actions and what the records cannot show. Read-only."
      inputs:
        person:
          title: "Person"
          type: string
          required: true
          description: "Person id, name, name prefix or a close typo (e.g. \"Alex Rivera\", \"alex\", \"rivera\")"
    - key: traceflow-person-impact
      name: "What breaks without a person"
      function: tf-person-impact
      actionVerb: GET
      description: "Blast radius if one person becomes unavailable: the epics, open work, pages, decisions and pull requests that lose their recorded owner, with evidence. Read-only."
      inputs:
        person:
          title: "Person"
          type: string
          required: true
          description: "Person id, name, name prefix or a close typo (e.g. \"Alex Rivera\", \"alex\", \"rivera\")"
    - key: traceflow-epic-lineage
      name: "Trace an epic"
      function: tf-epic-lineage
      actionVerb: GET
      description: "Traces one epic from intent to plan, work and code: the recorded links between them and the gaps, each with its evidence records. Read-only."
      inputs:
        epic:
          title: "Epic"
          type: string
          required: true
          description: "Epic key or title, any case (e.g. \"PAY-1\", \"pay-1\", \"Payments reliability\")"
    - key: traceflow-decision-trace
      name: "Trace a decision"
      function: tf-decision-trace
      actionVerb: GET
      description: "Traces one recorded decision: its status, the work linked to it, the people and their roles, and findings such as unapproved or superseded decisions still in use. Read-only."
      inputs:
        decision:
          title: "Decision"
          type: string
          required: true
          description: "Decision id or title, or a distinctive title word (e.g. \"d3\", \"idempotency key scope\", \"the idempotency decision\")"
    - key: traceflow-epic-impact
      name: "What breaks if an epic changes"
      function: tf-epic-impact
      actionVerb: GET
      description: "Blast radius if one epic changes: open work that loses its plan, pages and decisions to re-check, open pull requests on outdated intent, and who needs to know. Read-only."
      inputs:
        epic:
          title: "Epic"
          type: string
          required: true
          description: "Epic key or title, any case (e.g. \"PAY-1\", \"pay-1\", \"Payments reliability\")"
    - key: traceflow-decision-impact
      name: "What breaks if a decision changes"
      function: tf-decision-impact
      actionVerb: GET
      description: "Blast radius if one decision changes: the open work linked to it that must be reviewed, open pull requests that may implement the wrong intent, and who needs to know. Read-only."
      inputs:
        decision:
          title: "Decision"
          type: string
          required: true
          description: "Decision id or title, or a distinctive title word (e.g. \"d3\", \"idempotency key scope\", \"the idempotency decision\")"
    - key: traceflow-overview
      name: "Organization overview"
      function: tf-overview
      actionVerb: GET
      description: "Organization overview from the connected records: record counts, the top knowledge-risk people, epics ranked by recorded gaps, and coverage caveats. Read-only."
    - key: traceflow-investigate
      name: "Ask a question (deterministic, no model)"
      function: tf-investigate
      actionVerb: GET
      description: "Answers a question about knowledge-continuity risk, change impact, lineage or decisions from this site's Jira and Confluence records. Read-only. Returns the engine's answer with its evidence and caveats."
      inputs:
        question:
          title: "Question"
          type: string
          required: true
          description: "The question, e.g. \"What are the biggest knowledge risks right now?\" or \"What breaks if Alex leaves?\""
  # TF-06 inside Forge: the same actions as tools on Atlassian's MCP
  # infrastructure, for Rovo Studio agents and (once a site admin enables it)
  # external MCP clients at https://mcp.atlassian.com/forge/<app uuid>.
  rovo:mcp:
    - key: traceflow-mcp
      name: TraceFlow
      tools:
        - traceflow-list-people
        - traceflow-person-risk
        - traceflow-person-impact
        - traceflow-epic-lineage
        - traceflow-decision-trace
        - traceflow-epic-impact
        - traceflow-decision-impact
        - traceflow-overview
        - traceflow-investigate
  rovo:agent:
    - key: traceflow-analyst
      name: TraceFlow Risk Analyst
      description: Reveals knowledge-continuity risks and decision lineage in this workspace, with the evidence records behind every answer.
      prompt: |
        You are TraceFlow, an analyst for engineering organizations. You reveal
        knowledge-continuity risks and decision lineage, and every claim you
        make must come from the TraceFlow engine, never from your own knowledge.

        Rules:
        - To answer anything about risks, people, impact, epics or decisions,
          call a TraceFlow action. Use traceflow-investigate for open questions
          in the user's own words; use the specific actions when the user names
          a person, an epic or a decision. Never answer such questions from memory.
        - Every action returns a JSON payload built from the site's Jira and
          Confluence records. Relay it faithfully; you may make it friendlier, but
          never add people, record ids, titles or numbers that are not in the payload.
        - When traceflow-investigate returns "understood": false, say plainly that
          the question could not be mapped to the connected records, and offer its
          "suggestions" as examples of what to ask. Never guess.
        - When an action returns "ok": false, relay its "error" message as it is.
        - Keep the payload's caveats: they state what the records cannot prove,
          and every honest answer carries them.
        - When the payload has evidence records, offer them (source, id, url when
          present) so the user can open each one.
        - Findings are audit-ready evidence, not proof of compliance, and "sole
          contributor" means one recorded editor, never the only person who knows.
      conversationStarters:
        - What are the biggest knowledge risks right now?
        - What breaks if Alex leaves?
        - What are the top knowledge-continuity risks in the Payments reliability epic?
        - What happens if the idempotency key scope decision changes?
      actions:
        - traceflow-list-people
        - traceflow-person-risk
        - traceflow-person-impact
        - traceflow-epic-lineage
        - traceflow-decision-trace
        - traceflow-epic-impact
        - traceflow-decision-impact
        - traceflow-overview
        - traceflow-investigate
resources:
  # A Custom UI resource is a DIRECTORY holding a prebuilt index.html. Forge does
  # not build it: `npm run forge:build` (vite) writes src/frontend/build first.
  - key: workbench-ui
    path: src/frontend/build
permissions:
  # Reads run as the viewing user (asUser), so Jira and Confluence permissions apply.
  scopes:
    - read:jira-work
    - read:jira-user
    - read:page:confluence
    - storage:app
  # No external permissions: fonts are bundled (Geist Mono) or system (General
  # Sans falls back by design, DESIGN.md rule 10), and nothing leaves Atlassian,
  # which keeps the app eligible for Runs on Atlassian.
